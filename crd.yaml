apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: torrents.torrentdam.github.com
spec:
  group: torrentdam.github.com
  versions:
  - name: v1
    schema:
       openAPIV3Schema:
         type: object
         properties:
           spec:
             type: object
              required:
              - infoHash
              - pvcName
              - dhtNode
              - name
              properties:
                infoHash:
                  type: string
                pvcName:
                  type: string
                dhtNode:
                  type: string
                name:
                  type: string
                  description: Display name of the torrent, parsed from the magnet link dn parameter or info hash fallback.
                downloadPath:
                  type: string
                  description: Optional subdirectory inside the PVC where torrent files are placed. Defaults to the PVC root.
           status:
             type: object
             properties:
               phase:
                 type: string
               podName:
                 type: string
    subresources:
      status: {}
    served: true
    storage: true
  scope: Namespaced
  names:
    plural: torrents
    singular: torrent
    kind: Torrent
    listKind: TorrentList
