apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: torrents.torrentdam.github.com
spec:
  group: torrentdam.github.com
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
         type: object
         properties:
           spec:
             type: object
             required:
             - infoHash
             - pvcName
             - dhtNode
              properties:
                infoHash:
                  type: string
                pvcName:
                  type: string
                dhtNode:
                  type: string
                downloadPath:
                  type: string
                  default: ""
                  description: Subdirectory inside the PVC where torrent files are placed. Empty means the PVC root.
    served: true
    storage: true
  scope: Namespaced
  names:
    plural: torrents
    singular: torrent
    kind: Torrent
    listKind: TorrentList
