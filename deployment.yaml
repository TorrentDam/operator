apiVersion: v1
kind: ServiceAccount
metadata:
  name: torrentdam-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: torrentdam-operator
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["torrentdam.github.com"]
    resources: ["torrents", "torrents/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: torrentdam-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: torrentdam-operator
subjects:
  - kind: ServiceAccount
    name: torrentdam-operator
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: torrentdam-operator
  labels:
    app: torrentdam-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: torrentdam-operator
  template:
    metadata:
      labels:
        app: torrentdam-operator
    spec:
      serviceAccountName: torrentdam-operator
      containers:
        - name: operator
          image: ghcr.io/torrentdam/operator:latest
          imagePullPolicy: Always
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace